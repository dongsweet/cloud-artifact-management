<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云平台软件制品管理</title>
  <link rel="stylesheet" href="/assets/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/adminlte.min.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body"><div class="container-fluid"><a class="navbar-brand fw-semibold" href="#products">CAM · 制品管理</a><span class="text-body-secondary small">统一运维外部交换区</span></div></nav>
  <aside class="app-sidebar bg-dark shadow" data-bs-theme="dark"><div class="sidebar-brand"><span class="brand-text fw-light">发布版本管理</span></div><div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column" role="menu"><li class="nav-item"><a href="#products" class="nav-link" data-view="products"><span class="nav-icon bi bi-boxes"></span><p>软件产品</p></a></li><li class="nav-item"><a href="#releases" class="nav-link" data-view="releases"><span class="nav-icon bi bi-tags"></span><p>发布版本</p></a></li><li class="nav-item"><a href="#candidates" class="nav-link" data-view="candidates"><span class="nav-icon bi bi-box-seam"></span><p>候选包</p></a></li></ul></nav></div></aside>
  <main class="app-main"><div class="app-content-header"><div class="container-fluid"><div class="row"><div class="col-sm-6"><h3 class="mb-0" id="page-title">软件产品</h3></div><div class="col-sm-6"><ol class="breadcrumb float-sm-end"><li class="breadcrumb-item">CAM</li><li class="breadcrumb-item active" id="breadcrumb-title">软件产品</li></ol></div></div></div></div><div class="app-content"><div class="container-fluid">
    <div id="alert" class="alert d-none" role="alert"></div>
    <section id="view-products"><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title">软件产品</h3><button class="btn btn-primary btn-sm" data-modal="product"><i class="bi bi-plus-lg me-1"></i>创建软件产品</button></div><div class="card-body p-0 table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>产品名称</th><th>产品 ID</th><th>操作</th></tr></thead><tbody id="product-rows"></tbody></table></div></div></section>
    <section id="view-releases" class="d-none"><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title">发布版本</h3><button class="btn btn-primary btn-sm" data-modal="release"><i class="bi bi-plus-lg me-1"></i>创建发布版本</button></div><div class="card-body p-0 table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>软件产品</th><th>发布版本</th><th>候选包</th><th>状态</th><th>操作</th></tr></thead><tbody id="release-rows"></tbody></table></div></div></section>
    <section id="view-release-detail" class="d-none"><div class="card mb-3"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title" id="release-title">发布版本</h3><div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm" data-view="releases"><i class="bi bi-arrow-left me-1"></i>返回版本</button><button class="btn btn-primary btn-sm" id="new-round-button"><i class="bi bi-layers me-1"></i>创建下一轮</button></div></div><div class="card-body"><dl class="row mb-0" id="release-fields"></dl></div></div><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title">候选轮次</h3><select class="form-select form-select-sm round-select" id="round-select" aria-label="候选轮次"></select></div><div class="card-body"><div class="row g-3 mb-3" id="round-summary"></div><div class="d-flex justify-content-end mb-2"><button class="btn btn-primary btn-sm" id="new-package-button"><i class="bi bi-plus-lg me-1"></i>添加候选包</button></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>包标识</th><th>文件名</th><th>架构</th><th>摘要</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="round-candidate-rows"></tbody></table></div></div></div></section>
    <section id="view-candidate-detail" class="d-none"><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title" id="candidate-title">候选包</h3><button class="btn btn-outline-secondary btn-sm" data-view="release-detail"><i class="bi bi-arrow-left me-1"></i>返回轮次</button></div><div class="card-body"><dl class="row mb-0" id="candidate-fields"></dl><div class="mt-4 d-flex gap-2"><button id="receive-button" class="btn btn-primary"><i class="bi bi-cloud-download me-1"></i>从研发地址接收</button><button id="complete-button" class="btn btn-success"><i class="bi bi-shield-check me-1"></i>合并并固化</button></div><div class="progress mt-4" role="progressbar"><div id="detail-progress" class="progress-bar" style="width:0%">0%</div></div></div></div></section>
  </div></div></main>
</div>
<div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-title" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form id="product-form"><div class="modal-header"><h5 class="modal-title" id="product-modal-title">创建软件产品</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><label class="form-label" for="product-name">软件名称</label><input id="product-name" class="form-control" required placeholder="曙光云 Stack"></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div></div></div>
<div class="modal fade" id="release-modal" tabindex="-1" aria-labelledby="release-modal-title" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form id="release-form"><div class="modal-header"><h5 class="modal-title" id="release-modal-title">创建发布版本</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><label class="form-label" for="release-product">软件产品</label><select id="release-product" class="form-select mb-3" required></select><label class="form-label" for="release-version">发布版本</label><input id="release-version" class="form-control" required placeholder="8.0.6.2"></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">保存</button></div></form></div></div></div>
<div class="modal fade" id="package-modal" tabindex="-1" aria-labelledby="package-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="package-form"><div class="modal-header"><h5 class="modal-title" id="package-modal-title">添加候选包</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="package-url">研发文件地址</label><input id="package-url" class="form-control" type="url" required placeholder="https://研发内网地址/path/package.tar.gz"></div><div class="col-md-4"><label class="form-label" for="package-key">包标识</label><input id="package-key" class="form-control" placeholder="控制节点基础包"></div><div class="col-md-6"><label class="form-label" for="package-file-name">文件名（可选）</label><input id="package-file-name" class="form-control" placeholder="从 URL 自动解析"></div><div class="col-md-6"><label class="form-label" for="package-version">包版本（可选）</label><input id="package-version" class="form-control" placeholder="默认继承发布版本"></div><div class="col-md-4"><label class="form-label" for="package-architecture">架构</label><input id="package-architecture" class="form-control" placeholder="x86_64"></div><div class="col-md-4"><label class="form-label" for="package-size">文件大小（字节，可选）</label><input id="package-size" class="form-control" type="number" min="0"></div><div class="col-md-4"><label class="form-label" for="package-md5">MD5（可选）</label><input id="package-md5" class="form-control font-monospace" pattern="[a-fA-F0-9]{32}"></div><div class="col-md-8"><label class="form-label" for="package-sha256">SHA-256（可选）</label><input id="package-sha256" class="form-control font-monospace" pattern="[a-fA-F0-9]{64}"></div><div class="col-md-4"><label class="form-label" for="package-targets">目标范围</label><input id="package-targets" class="form-control" placeholder="政务外网,互联网"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">创建候选包</button></div></form></div></div></div>
<script src="/assets/bootstrap.bundle.min.js"></script><script src="/assets/adminlte.min.js"></script><script type="module" src="/assets/app.js"></script>
</body>
</html>
