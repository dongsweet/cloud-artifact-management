# Direct-connect test deployment. This file intentionally omits Hillstone and
# runs cam-edge on the ordinary CAM Docker network.
services:
  # Test-only mapping-mode stand-in for the Hillstone gateway. This container
  # has no isolation or inspection capability; it only forwards four fixed
  # application channels inside the direct-connect test network.
  cam-gate-sim:
    build:
      context: .
      dockerfile: cam-gate-sim.Dockerfile
    image: cam-gate-sim:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    environment:
      CAM_GATE_SIM_BIND: 0.0.0.0
      CAM_GATE_SIM_CORE_CONTROL_PORT: 3201
      CAM_GATE_SIM_CORE_CONTROL_TARGET: http://cam-core:3102
      CAM_GATE_SIM_CORE_TRANSFER_PORT: 3202
      CAM_GATE_SIM_CORE_TRANSFER_TARGET: http://cam-core:3102
      CAM_GATE_SIM_EDGE_CONTROL_PORT: 3203
      CAM_GATE_SIM_EDGE_CONTROL_TARGET: http://cam-edge:3101
      CAM_GATE_SIM_EDGE_TRANSFER_PORT: 3204
      CAM_GATE_SIM_EDGE_TRANSFER_TARGET: http://cam-edge:3101
      CAM_GATE_SIM_UPSTREAM_TIMEOUT_MS: ${CAM_GATE_SIM_UPSTREAM_TIMEOUT_MS:-60000}
    depends_on:
      - cam-edge
      - cam-core
    networks:
      - default
    expose:
      - "3201"
      - "3202"
      - "3203"
      - "3204"
    restart: unless-stopped

  cam-edge-web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-edge-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,nosuid,nodev
    depends_on:
      - cam-edge
      - cam-core
      - cam-agent
    networks:
      - default
    ports:
      - "127.0.0.1:8088:8080"
    restart: unless-stopped

  cam-core-web:
    build:
      context: .
      dockerfile: core-web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-core-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    depends_on:
      - cam-core
    networks:
      - default
    ports:
      - "127.0.0.1:8092:8080"
    restart: unless-stopped

  cam-edge:
    build:
      context: .
      args:
        SERVICE: cam-edge
    image: cam-edge:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_EDGE_DATA_DIR:-/var/lib/cloud-artifact-management/edge}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3101
      DATA_DIR: /data/edge
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.240.0/24}
      CAM_SOURCE_ALLOWLIST: ${CAM_SOURCE_ALLOWLIST:-}
      CAM_APPROVAL_MODE: ${CAM_APPROVAL_MODE:-cloud}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_SHARED_SECRET: ${CAM_GATE_SHARED_SECRET:-}
      CAM_GATE_CORE_CONTROL_URL: ${CAM_GATE_CORE_CONTROL_URL:-http://cam-gate-sim:3201}
      CAM_GATE_CORE_TRANSFER_URL: ${CAM_GATE_CORE_TRANSFER_URL:-http://cam-gate-sim:3202}
      CAM_GATE_EDGE_CONTROL_URL: ${CAM_GATE_EDGE_CONTROL_URL:-http://cam-gate-sim:3203}
      CAM_GATE_EDGE_TRANSFER_URL: ${CAM_GATE_EDGE_TRANSFER_URL:-http://cam-gate-sim:3204}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  cam-core:
    build:
      context: .
      args:
        SERVICE: cam-core
    image: cam-core:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_CORE_DATA_DIR:-/var/lib/cloud-artifact-management/core}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3102
      DATA_DIR: /data/core
      CAM_GATE_SHARED_SECRET: ${CAM_GATE_SHARED_SECRET:-}
      CAM_GATE_PREVIOUS_SHARED_SECRET: ${CAM_GATE_PREVIOUS_SHARED_SECRET:-}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_CORE_CONTROL_URL: ${CAM_GATE_CORE_CONTROL_URL:-http://cam-gate-sim:3201}
      CAM_GATE_CORE_TRANSFER_URL: ${CAM_GATE_CORE_TRANSFER_URL:-http://cam-gate-sim:3202}
      CAM_GATE_EDGE_CONTROL_URL: ${CAM_GATE_EDGE_CONTROL_URL:-http://cam-gate-sim:3203}
      CAM_GATE_EDGE_TRANSFER_URL: ${CAM_GATE_EDGE_TRANSFER_URL:-http://cam-gate-sim:3204}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
      CAM_CLOUD_API_BASE_URL: ${CAM_CLOUD_API_BASE_URL:-}
      CAM_CLOUD_AUTH_USER_ID: ${CAM_CLOUD_AUTH_USER_ID:-}
      CAM_CLOUD_AUTH_USERNAME: ${CAM_CLOUD_AUTH_USERNAME:-}
      CAM_CLOUD_AUTH_SECRET: ${CAM_CLOUD_AUTH_SECRET:-}
      CAM_CLOUD_WORK_ORDER_PRIORITY_LABEL: ${CAM_CLOUD_WORK_ORDER_PRIORITY_LABEL:-}
      CAM_CLOUD_WORK_ORDER_PRIORITY_VALUE: ${CAM_CLOUD_WORK_ORDER_PRIORITY_VALUE:-}
      CAM_CLOUD_WORK_ORDER_SOURCE_LABEL: ${CAM_CLOUD_WORK_ORDER_SOURCE_LABEL:-}
      CAM_CLOUD_WORK_ORDER_SOURCE_VALUE: ${CAM_CLOUD_WORK_ORDER_SOURCE_VALUE:-}
      CAM_CLOUD_WORK_ORDER_BUSINESS_TYPE_PATH: ${CAM_CLOUD_WORK_ORDER_BUSINESS_TYPE_PATH:-}
      CAM_CLOUD_WORK_ORDER_DEPT_NAME: ${CAM_CLOUD_WORK_ORDER_DEPT_NAME:-}
      CAM_CLOUD_WORK_ORDER_TEAM_NAME: ${CAM_CLOUD_WORK_ORDER_TEAM_NAME:-}
      CAM_CLOUD_WORK_ORDER_PROCESS_USER_IDS: ${CAM_CLOUD_WORK_ORDER_PROCESS_USER_IDS:-}
      CAM_CLOUD_WORK_ORDER_TITLE_PREFIX: ${CAM_CLOUD_WORK_ORDER_TITLE_PREFIX:-}
      CAM_CLOUD_HTTP_PROXY: ${CAM_CLOUD_HTTP_PROXY:-}
      CAM_CLOUD_TIMEOUT_MS: ${CAM_CLOUD_TIMEOUT_MS:-10000}
    networks:
      - default
    ports:
      - "127.0.0.1:3102:3102"
    restart: unless-stopped

  cam-agent:
    build:
      context: .
      args:
        SERVICE: cam-agent
    image: cam-agent:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_AGENT_DATA_DIR:-/var/lib/cloud-artifact-management/agent}:/data
    environment:
      HOST: 0.0.0.0
      PORT: 3103
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.240.0/24}
