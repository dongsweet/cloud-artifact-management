# Direct-connect test deployment. This file intentionally omits Hillstone and
# runs cam-edge on the ordinary CAM Docker network.
services:
  cam-edge-web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-edge-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,nosuid,nodev
    depends_on:
      - cam-edge
      - cam-core
      - cam-agent
    networks:
      - default
    ports:
      - "8088:8080"
    restart: unless-stopped

  cam-edge:
    build:
      context: .
      args:
        SERVICE: cam-edge
    image: cam-edge:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_EDGE_DATA_DIR:-/var/lib/cloud-artifact-management/edge}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3101
      DATA_DIR: /data/edge
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.240.0/24}
      CAM_SOURCE_ALLOWLIST: ${CAM_SOURCE_ALLOWLIST:-}
      CAM_APPROVAL_MODE: ${CAM_APPROVAL_MODE:-cloud}
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  cam-core:
    build:
      context: .
      args:
        SERVICE: cam-core
    image: cam-core:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_CORE_DATA_DIR:-/var/lib/cloud-artifact-management/core}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3102
      CAM_GATE_SHARED_SECRET: ${CAM_GATE_SHARED_SECRET:-}
      CAM_CLOUD_API_BASE_URL: ${CAM_CLOUD_API_BASE_URL:-}
      CAM_CLOUD_API_TOKEN_FILE: ${CAM_CLOUD_API_TOKEN_FILE:-}
      CAM_CLOUD_HTTP_PROXY: ${CAM_CLOUD_HTTP_PROXY:-}
      CAM_CLOUD_CREATE_PATH: ${CAM_CLOUD_CREATE_PATH:-/api/v1/release-approvals}
      CAM_CLOUD_STATUS_PATH: ${CAM_CLOUD_STATUS_PATH:-/api/v1/release-approvals/{approvalId}}
      CAM_CLOUD_CLOSE_PATH: ${CAM_CLOUD_CLOSE_PATH:-/api/v1/release-approvals/{approvalId}/close}
      CAM_CLOUD_TIMEOUT_MS: ${CAM_CLOUD_TIMEOUT_MS:-10000}
    networks:
      - default
    restart: unless-stopped

  cam-agent:
    build:
      context: .
      args:
        SERVICE: cam-agent
    image: cam-agent:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_AGENT_DATA_DIR:-/var/lib/cloud-artifact-management/agent}:/data
    environment:
      HOST: 0.0.0.0
      PORT: 3103
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.240.0/24}
