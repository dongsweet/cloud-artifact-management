# Direct-connect test deployment. This file intentionally omits Hillstone and
# runs cam-edge on the ordinary CAM Docker network.
services:
  # Test-only mapping-mode stand-in for the Hillstone gateway. This container
  # has no isolation or inspection capability; it only forwards four fixed
  # application channels inside the direct-connect test network.
  cam-gate-sim:
    build:
      context: .
      dockerfile: cam-gate-sim.Dockerfile
    image: cam-gate-sim:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    environment:
      CAM_GATE_SIM_BIND: 0.0.0.0
      CAM_GATE_SIM_CORE_CONTROL_PORT: 3201
      CAM_GATE_SIM_CORE_CONTROL_TARGET: http://cam-core:3102
      CAM_GATE_SIM_CORE_TRANSFER_PORT: 3202
      CAM_GATE_SIM_CORE_TRANSFER_TARGET: http://cam-core:3102
      CAM_GATE_SIM_EDGE_CONTROL_PORT: 3203
      CAM_GATE_SIM_EDGE_CONTROL_TARGET: http://cam-edge:3101
      CAM_GATE_SIM_EDGE_TRANSFER_PORT: 3204
      CAM_GATE_SIM_EDGE_TRANSFER_TARGET: http://cam-edge:3101
      CAM_GATE_SIM_UPSTREAM_TIMEOUT_MS: ${CAM_GATE_SIM_UPSTREAM_TIMEOUT_MS:-60000}
    depends_on:
      - cam-edge
      - cam-core
    networks:
      - default
    expose:
      - "3201"
      - "3202"
      - "3203"
      - "3204"
    restart: unless-stopped

  cam-edge-web:
    build:
      context: .
      dockerfile: edge-web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-edge-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001,nosuid,nodev
    volumes:
      - ${CAM_EDGE_TLS_DIR:-/var/lib/cloud-artifact-management/edge/tls}:/tls:ro
    environment:
      CAM_CADDY_MODULE: edge
      CAM_EDGE_WEB_HTTPS: ${CAM_EDGE_WEB_HTTPS:-false}
      CAM_EDGE_WEB_TLS_CERT_FILE: ${CAM_EDGE_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_EDGE_WEB_TLS_KEY_FILE: ${CAM_EDGE_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_EDGE_CONTROL_HTTPS: ${CAM_EDGE_CONTROL_HTTPS:-false}
      CAM_EDGE_CONTROL_TLS_CERT_FILE: ${CAM_EDGE_CONTROL_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_EDGE_CONTROL_TLS_KEY_FILE: ${CAM_EDGE_CONTROL_TLS_KEY_FILE:-/tls/privkey.pem}
    depends_on:
      - cam-edge
      - cam-core
      - cam-agent-1
      - cam-agent-2
    networks:
      - default
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8101:8101"
    restart: unless-stopped

  cam-core-web:
    build:
      context: .
      dockerfile: core-web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-core-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    volumes:
      - ${CAM_CORE_TLS_DIR:-/var/lib/cloud-artifact-management/core/tls}:/tls:ro
    depends_on:
      - cam-core
    environment:
      CAM_AGENT_UPSTREAM: ${CAM_AGENT_UPSTREAM:-cam-agent-web-1:8080}
      CAM_CADDY_MODULE: core
      CAM_CORE_WEB_HTTPS: ${CAM_CORE_WEB_HTTPS:-false}
      CAM_CORE_WEB_TLS_CERT_FILE: ${CAM_CORE_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_WEB_TLS_KEY_FILE: ${CAM_CORE_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_CORE_CONTROL_HTTPS: ${CAM_CORE_CONTROL_HTTPS:-false}
      CAM_CORE_CONTROL_TLS_CERT_FILE: ${CAM_CORE_CONTROL_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_CONTROL_TLS_KEY_FILE: ${CAM_CORE_CONTROL_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_CORE_TRANSFER_HTTPS: ${CAM_CORE_TRANSFER_HTTPS:-false}
      CAM_CORE_TRANSFER_TLS_CERT_FILE: ${CAM_CORE_TRANSFER_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_TRANSFER_TLS_KEY_FILE: ${CAM_CORE_TRANSFER_TLS_KEY_FILE:-/tls/privkey.pem}
    networks:
      - default
    ports:
      - "127.0.0.1:8092:8080"
      - "127.0.0.1:8201:8201"
      - "127.0.0.1:8202:8202"
    restart: unless-stopped

  cam-edge:
    build:
      context: .
      args:
        SERVICE: cam-edge
    image: cam-edge:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_EDGE_DATA_DIR:-/var/lib/cloud-artifact-management/edge}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3101
      DATA_DIR: /data/edge
      CAM_LOG_DIR: /data/edge/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.240.0/24}
      CAM_SOURCE_ALLOWLIST: ${CAM_SOURCE_ALLOWLIST:-}
      CAM_MAX_CANDIDATE_SIZE: ${CAM_MAX_CANDIDATE_SIZE:-2199023255552}
      CAM_APPROVAL_MODE: ${CAM_APPROVAL_MODE:-cloud}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_CORE_CONTROL_URL: ${CAM_GATE_CORE_CONTROL_URL:-http://cam-gate-sim:3201}
      CAM_GATE_CORE_TRANSFER_URL: ${CAM_GATE_CORE_TRANSFER_URL:-http://cam-gate-sim:3202}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_TRANSFER_START_TIMEOUT_MS: ${CAM_GATE_TRANSFER_START_TIMEOUT_MS:-120000}
      CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS: ${CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS:-90000}
      CAM_GATE_TRANSFER_HEARTBEAT_MS: ${CAM_GATE_TRANSFER_HEARTBEAT_MS:-15000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  cam-core:
    env_file:
      - ./deploy/.env
    build:
      context: .
      args:
        SERVICE: cam-core
    image: cam-core:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - ${CAM_CORE_DATA_DIR:-/var/lib/cloud-artifact-management/core}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3102
      DATA_DIR: /data/core
      CAM_LOG_DIR: /data/core/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_EDGE_CONTROL_URL: ${CAM_GATE_EDGE_CONTROL_URL:-http://cam-gate-sim:3203}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_TRANSFER_START_TIMEOUT_MS: ${CAM_GATE_TRANSFER_START_TIMEOUT_MS:-120000}
      CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS: ${CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS:-90000}
      CAM_GATE_TRANSFER_HEARTBEAT_MS: ${CAM_GATE_TRANSFER_HEARTBEAT_MS:-15000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
    networks:
      - default
    ports:
      - "127.0.0.1:3102:3102"
    restart: unless-stopped

  cam-agent-1:
    build:
      context: .
      args:
        SERVICE: cam-agent
    image: cam-agent:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 主机绑定目录必须持久化：其中包含 Agent identity.json（私钥）、agent.sqlite 和缓存。
    volumes:
      - ${CAM_AGENT_1_DATA_DIR:-/var/lib/cloud-artifact-management/agent-1}:/data
    environment:
      HOST: 0.0.0.0
      PORT: 3103
      DATA_DIR: /data/agent
      CAM_LOG_DIR: /data/agent/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_AGENT_POLL_MS: ${CAM_AGENT_POLL_MS:-5000}
      CAM_AGENT_CHUNK_SIZE: ${CAM_AGENT_CHUNK_SIZE:-4194304}
      CAM_AGENT_CONCURRENCY: ${CAM_AGENT_CONCURRENCY:-4}
      CAM_AAA_BASE_URL: ${CAM_AAA_BASE_URL:-}
      CAM_AAA_TENANT_NAME: ${CAM_AAA_TENANT_NAME:-}
      CAM_AAA_ACCESS_SERVER_NAME: ${CAM_AAA_ACCESS_SERVER_NAME:-}
      CAM_AAA_SHARED_SECRET: ${CAM_AAA_SHARED_SECRET:-}
      CAM_AAA_TIMEOUT_MS: ${CAM_AAA_TIMEOUT_MS:-10000}
      CAM_AAA_ALLOW_HTTP: ${CAM_AAA_ALLOW_HTTP:-false}
    networks:
      - default
    restart: unless-stopped

  cam-agent-web-1:
    build:
      context: .
      dockerfile: agent-web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-agent-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    environment:
      CAM_AGENT_UPSTREAM: cam-agent-1:3103
      CAM_CADDY_MODULE: agent
      CAM_AGENT_WEB_HTTPS: ${CAM_AGENT_WEB_HTTPS:-false}
      CAM_AGENT_WEB_TLS_CERT_FILE: ${CAM_AGENT_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_AGENT_WEB_TLS_KEY_FILE: ${CAM_AGENT_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
    depends_on:
      - cam-agent-1
    networks:
      - default
    ports:
      - "127.0.0.1:3111:8080"
    restart: unless-stopped

  cam-agent-2:
    build:
      context: .
      args:
        SERVICE: cam-agent
    image: cam-agent:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 主机绑定目录必须持久化：其中包含 Agent identity.json（私钥）、agent.sqlite 和缓存。
    volumes:
      - ${CAM_AGENT_2_DATA_DIR:-/var/lib/cloud-artifact-management/agent-2}:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3103
      DATA_DIR: /data/agent
      CAM_LOG_DIR: /data/agent/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_AGENT_POLL_MS: ${CAM_AGENT_POLL_MS:-5000}
      CAM_AGENT_CHUNK_SIZE: ${CAM_AGENT_CHUNK_SIZE:-4194304}
      CAM_AGENT_CONCURRENCY: ${CAM_AGENT_CONCURRENCY:-4}
      CAM_AAA_BASE_URL: ${CAM_AAA_BASE_URL:-}
      CAM_AAA_TENANT_NAME: ${CAM_AAA_TENANT_NAME:-}
      CAM_AAA_ACCESS_SERVER_NAME: ${CAM_AAA_ACCESS_SERVER_NAME:-}
      CAM_AAA_SHARED_SECRET: ${CAM_AAA_SHARED_SECRET:-}
      CAM_AAA_TIMEOUT_MS: ${CAM_AAA_TIMEOUT_MS:-10000}
      CAM_AAA_ALLOW_HTTP: ${CAM_AAA_ALLOW_HTTP:-false}
    networks:
      - default
    restart: unless-stopped

  cam-agent-web-2:
    build:
      context: .
      dockerfile: agent-web.Dockerfile
      args:
        CADDY_BASE_IMAGE: ${CADDY_BASE_IMAGE:-caddy:2.11.4}
    image: cam-agent-web:dev
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    environment:
      CAM_AGENT_UPSTREAM: cam-agent-2:3103
      CAM_CADDY_MODULE: agent
      CAM_AGENT_WEB_HTTPS: ${CAM_AGENT_WEB_HTTPS:-false}
      CAM_AGENT_WEB_TLS_CERT_FILE: ${CAM_AGENT_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_AGENT_WEB_TLS_KEY_FILE: ${CAM_AGENT_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
    depends_on:
      - cam-agent-2
    networks:
      - default
    ports:
      - "127.0.0.1:3112:8080"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.240.0/24}
