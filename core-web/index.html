<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAM Core · 内网发布审批</title><link rel="stylesheet" href="/assets/bootstrap.min.css"><link rel="stylesheet" href="/assets/bootstrap-icons.min.css"><link rel="stylesheet" href="/assets/adminlte.min.css"><link rel="stylesheet" href="/assets/core.css"></head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div id="login" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-body-tertiary" style="z-index:10"><div class="card shadow" style="width:380px;max-width:95vw"><div class="card-header"><h3 class="card-title">统一运维内网 · CAM Core</h3></div><form id="login-form"><div class="card-body"><div id="login-error" class="alert alert-danger d-none"></div><label class="form-label">用户名</label><input id="username" class="form-control mb-3" required autocomplete="username"><label class="form-label">密码</label><input id="password" type="password" class="form-control" required autocomplete="current-password"></div><div class="card-footer text-end"><button class="btn btn-primary">登录</button></div></form></div></div></div>
<div id="password-change" class="position-fixed top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center bg-body-tertiary" style="z-index:11"><div class="card shadow" style="width:440px;max-width:95vw"><div class="card-header"><h3 class="card-title">修改初始密码</h3></div><form id="password-form"><div class="card-body"><div class="alert alert-info">首次登录必须修改初始密码。</div><div id="password-error" class="alert alert-danger d-none"></div><label class="form-label">当前密码</label><input id="old-password" type="password" class="form-control mb-3" required><label class="form-label">新密码（至少 12 个字符）</label><input id="new-password" type="password" class="form-control" minlength="12" required></div><div class="card-footer text-end"><button class="btn btn-primary">修改密码</button></div></form></div></div></div>
<div id="app" class="app-wrapper d-none"><nav class="app-header navbar bg-body"><div class="container-fluid"><span class="navbar-brand fw-semibold">CAM Core · 内网发布审批</span><span><span id="user-label" class="text-body-secondary me-3"></span><button id="logout" class="btn btn-outline-secondary btn-sm">退出</button></span></div></nav><aside class="app-sidebar bg-dark shadow" data-bs-theme="dark"><div class="sidebar-brand"><span class="brand-text">内网审批联动</span></div><div class="sidebar-wrapper"><nav><ul class="nav sidebar-menu flex-column"><li class="nav-item"><a href="#requests" class="nav-link active"><span class="nav-icon bi bi-clipboard-check"></span><p>审批请求</p></a></li></ul></nav></div></aside><main class="app-main"><div class="app-content-header"><div class="container-fluid"><h3 class="mb-0">云管审批请求</h3></div></div><div class="app-content"><div class="container-fluid"><div id="alert" class="alert d-none"></div><div class="card"><div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title">发布固化审批</h3><button id="refresh" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button></div><div class="card-body p-0 table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>请求 ID</th><th>版本 / 轮次</th><th>状态</th><th>云管审批</th><th>清单摘要</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="detail" class="card d-none"><div class="card-header"><h3 class="card-title">审批请求详情</h3></div><div class="card-body"><dl id="fields" class="row mb-3"></dl><div id="actions" class="d-flex gap-2"></div></div></div></div></div></main></div><script type="module" src="/assets/core.js"></script></body></html>
