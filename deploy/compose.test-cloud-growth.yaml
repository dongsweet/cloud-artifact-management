# Test-only overlay. It joins cam-core to the existing cloud-growth-tracker
# Docker network. The host route helper sends cloud-manager traffic through
# easyconnect-vpn without configuring an application-layer HTTP proxy. This
# file is not part of the production deployment design.
services:
  cam-core:
    networks:
      default: {}
      cloud-growth-tracker: {}
    environment:
      CAM_CLOUD_HTTP_PROXY: ""

networks:
  cloud-growth-tracker:
    external: true
    name: cloud-growth-tracker_default
