name: cam-core

services:
  cam-core:
    image: ${CAM_CORE_IMAGE:-cam-backend:0.2.4}
    container_name: cam-core
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 主机绑定目录必须持久化：包含 core.sqlite、core-agent-identity.json（Core 私钥）和 gate-keyring.json。
    # 删除或更换目录会导致服务身份丢失并需要重新配对。
    volumes:
      - ${CAM_DATA_DIR:-/var/lib/cloud-artifact-management/core}:/data
    environment:
      # The backend image is shared by all modules; SERVICE selects this module.
      SERVICE: cam-core
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3102
      DATA_DIR: /data/core
      CAM_LOG_DIR: /data/core/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.242.0/24}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_EDGE_CONTROL_URL: ${CAM_GATE_EDGE_CONTROL_URL:-}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_TRANSFER_START_TIMEOUT_MS: ${CAM_GATE_TRANSFER_START_TIMEOUT_MS:-120000}
      CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS: ${CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS:-90000}
      CAM_GATE_TRANSFER_HEARTBEAT_MS: ${CAM_GATE_TRANSFER_HEARTBEAT_MS:-15000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
      CAM_CLOUD_API_BASE_URL: ${CAM_CLOUD_API_BASE_URL:-}
      CAM_CLOUD_AUTH_USER_ID: ${CAM_CLOUD_AUTH_USER_ID:-}
      CAM_CLOUD_AUTH_USERNAME: ${CAM_CLOUD_AUTH_USERNAME:-}
      CAM_CLOUD_AUTH_SECRET: ${CAM_CLOUD_AUTH_SECRET:-}
      CAM_CLOUD_TLS_CA_FILE: ${CAM_CLOUD_TLS_CA_FILE:-}
      CAM_CLOUD_TLS_INSECURE: ${CAM_CLOUD_TLS_INSECURE:-false}
      CAM_CLOUD_WORK_ORDER_PRIORITY_LABEL: ${CAM_CLOUD_WORK_ORDER_PRIORITY_LABEL:-常规变更}
      CAM_CLOUD_WORK_ORDER_PRIORITY_VALUE: ${CAM_CLOUD_WORK_ORDER_PRIORITY_VALUE:-}
      CAM_CLOUD_WORK_ORDER_SOURCE_LABEL: ${CAM_CLOUD_WORK_ORDER_SOURCE_LABEL:-内部需求}
      CAM_CLOUD_WORK_ORDER_SOURCE_VALUE: ${CAM_CLOUD_WORK_ORDER_SOURCE_VALUE:-}
      CAM_CLOUD_WORK_ORDER_BUSINESS_TYPE_PATH: ${CAM_CLOUD_WORK_ORDER_BUSINESS_TYPE_PATH:-平台类/其他}
      CAM_CLOUD_WORK_ORDER_DEPT_NAME: ${CAM_CLOUD_WORK_ORDER_DEPT_NAME:-成都}
      CAM_CLOUD_WORK_ORDER_TEAM_NAME: ${CAM_CLOUD_WORK_ORDER_TEAM_NAME:-OpenStack平台运维}
      CAM_CLOUD_WORK_ORDER_PROCESS_USER_NAMES: ${CAM_CLOUD_WORK_ORDER_PROCESS_USER_NAMES:-}
      CAM_CLOUD_WORK_ORDER_TITLE_PREFIX: ${CAM_CLOUD_WORK_ORDER_TITLE_PREFIX:-云平台制品验证报告审批}
      CAM_CLOUD_TIMEOUT_MS: ${CAM_CLOUD_TIMEOUT_MS:-10000}
      CAM_AAA_BASE_URL: ${CAM_AAA_BASE_URL:-}
      CAM_AAA_TENANT_NAME: ${CAM_AAA_TENANT_NAME:-}
      CAM_AAA_ACCESS_SERVER_NAME: ${CAM_AAA_ACCESS_SERVER_NAME:-}
      CAM_AAA_SHARED_SECRET: ${CAM_AAA_SHARED_SECRET:-}
      CAM_AAA_TIMEOUT_MS: ${CAM_AAA_TIMEOUT_MS:-10000}
      CAM_AAA_ALLOW_HTTP: ${CAM_AAA_ALLOW_HTTP:-false}
      CAM_AAA_SKIP_TLS_VERIFICATION: ${CAM_AAA_SKIP_TLS_VERIFICATION:-false}
    # The API is reachable only from cam-core-web on the Compose network.
    # Do not publish the backend port on the production host.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cam-core-web:
    image: ${CAM_CORE_WEB_IMAGE:-cam-core-web:1.0.0}
    container_name: cam-core-web
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    volumes:
      - ${CAM_CORE_TLS_DIR:-/var/lib/cloud-artifact-management/core/tls}:/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CAM_AGENT_UPSTREAM: ${CAM_AGENT_UPSTREAM:-host.docker.internal:80}
      CAM_CADDY_MODULE: core
      CAM_CORE_WEB_HTTPS: ${CAM_CORE_WEB_HTTPS:-false}
      CAM_CORE_WEB_TLS_CERT_FILE: ${CAM_CORE_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_WEB_TLS_KEY_FILE: ${CAM_CORE_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_CORE_CONTROL_HTTPS: ${CAM_CORE_CONTROL_HTTPS:-false}
      CAM_CORE_CONTROL_TLS_CERT_FILE: ${CAM_CORE_CONTROL_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_CONTROL_TLS_KEY_FILE: ${CAM_CORE_CONTROL_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_CORE_TRANSFER_HTTPS: ${CAM_CORE_TRANSFER_HTTPS:-false}
      CAM_CORE_TRANSFER_TLS_CERT_FILE: ${CAM_CORE_TRANSFER_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_CORE_TRANSFER_TLS_KEY_FILE: ${CAM_CORE_TRANSFER_TLS_KEY_FILE:-/tls/privkey.pem}
    depends_on:
      - cam-core
    ports:
      - "${CAM_CORE_WEB_HTTP_BIND:-0.0.0.0}:${CAM_CORE_WEB_HTTP_PORT:-80}:8080"
      - "${CAM_CORE_WEB_HTTPS_BIND:-0.0.0.0}:${CAM_CORE_WEB_HTTPS_PORT:-443}:8443"
      - "${CAM_CORE_CONTROL_BIND:-0.0.0.0}:${CAM_CORE_CONTROL_PORT:-8201}:8201"
      - "${CAM_CORE_TRANSFER_BIND:-0.0.0.0}:${CAM_CORE_TRANSFER_PORT:-8202}:8202"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.242.0/24}

