services:
  cam-agent:
    image: ${CAM_AGENT_IMAGE:-cam-backend:0.2.4}
    container_name: cam-agent
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 主机绑定目录必须持久化：其中包含 agent.sqlite、identity.json（Agent 私钥）和制品缓存。
    # `docker compose down` 不会删除该目录；删除或更换目录会导致身份丢失并需要重新配对。
    volumes:
      - ${CAM_AGENT_DATA_DIR:-/var/lib/cloud-artifact-management/agent}:/data
    environment:
      # The backend image is shared by all modules; SERVICE selects this module.
      SERVICE: cam-agent
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3103
      DATA_DIR: /data/agent
      CAM_LOG_DIR: /data/agent/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.243.0/24}
      CAM_AGENT_POLL_MS: ${CAM_AGENT_POLL_MS:-5000}
      CAM_AGENT_CHUNK_SIZE: ${CAM_AGENT_CHUNK_SIZE:-4194304}
      CAM_AGENT_CONCURRENCY: ${CAM_AGENT_CONCURRENCY:-4}
      CAM_AAA_BASE_URL: ${CAM_AAA_BASE_URL:-}
      CAM_AAA_TENANT_NAME: ${CAM_AAA_TENANT_NAME:-}
      CAM_AAA_ACCESS_SERVER_NAME: ${CAM_AAA_ACCESS_SERVER_NAME:-}
      CAM_AAA_SHARED_SECRET: ${CAM_AAA_SHARED_SECRET:-}
      CAM_AAA_TIMEOUT_MS: ${CAM_AAA_TIMEOUT_MS:-10000}
      CAM_AAA_ALLOW_HTTP: ${CAM_AAA_ALLOW_HTTP:-false}
      CAM_AAA_SKIP_TLS_VERIFICATION: ${CAM_AAA_SKIP_TLS_VERIFICATION:-false}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cam-agent-web:
    image: ${CAM_AGENT_WEB_IMAGE:-cam-agent-web:1.0.0}
    container_name: cam-agent-web
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    environment:
      CAM_AGENT_UPSTREAM: ${CAM_AGENT_UPSTREAM:-cam-agent:3103}
    depends_on:
      - cam-agent
    ports:
      - "${CAM_AGENT_WEB_BIND:-127.0.0.1}:${CAM_AGENT_WEB_PORT:-3111}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.243.0/24}

