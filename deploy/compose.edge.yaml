name: cam-edge

services:
  cam-edge:
    image: ${CAM_EDGE_IMAGE:-cam-backend:0.2.4}
    container_name: cam-edge
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # 主机绑定目录必须持久化：包含 edge.sqlite、gate-keyring.json 和制品文件。
    volumes:
      - ${CAM_DATA_DIR:-/var/lib/cloud-artifact-management/edge}:/data
    environment:
      # The backend image is shared by all modules; SERVICE selects this module.
      SERVICE: cam-edge
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3101
      DATA_DIR: /data/edge
      CAM_LOG_DIR: /data/edge/logs
      CAM_LOG_MAX_BYTES: ${CAM_LOG_MAX_BYTES:-52428800}
      CAM_LOG_MAX_FILES: ${CAM_LOG_MAX_FILES:-5}
      CAM_LOG_COLLECTION_MAX_BYTES: ${CAM_LOG_COLLECTION_MAX_BYTES:-104857600}
      CAM_COOKIE_SECURE: ${CAM_COOKIE_SECURE:-true}
      CAM_TRUST_PROXY: ${CAM_TRUST_PROXY:-192.168.241.0/24}
      CAM_SOURCE_ALLOWLIST: ${CAM_SOURCE_ALLOWLIST:-}
      CAM_MAX_CANDIDATE_SIZE: ${CAM_MAX_CANDIDATE_SIZE:-2199023255552}
      CAM_APPROVAL_MODE: ${CAM_APPROVAL_MODE:-cloud}
      CAM_GATE_MODE: ${CAM_GATE_MODE:-mapping}
      CAM_GATE_CORE_CONTROL_URL: ${CAM_GATE_CORE_CONTROL_URL:-}
      CAM_GATE_CORE_TRANSFER_URL: ${CAM_GATE_CORE_TRANSFER_URL:-}
      CAM_GATE_CONNECT_TIMEOUT_MS: ${CAM_GATE_CONNECT_TIMEOUT_MS:-10000}
      CAM_GATE_TRANSFER_TIMEOUT_MS: ${CAM_GATE_TRANSFER_TIMEOUT_MS:-60000}
      CAM_GATE_TRANSFER_START_TIMEOUT_MS: ${CAM_GATE_TRANSFER_START_TIMEOUT_MS:-120000}
      CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS: ${CAM_GATE_TRANSFER_IDLE_TIMEOUT_MS:-90000}
      CAM_GATE_TRANSFER_HEARTBEAT_MS: ${CAM_GATE_TRANSFER_HEARTBEAT_MS:-15000}
      CAM_GATE_CHUNK_SIZE_BYTES: ${CAM_GATE_CHUNK_SIZE_BYTES:-268435456}
      CAM_GATE_RETRY_LIMIT: ${CAM_GATE_RETRY_LIMIT:-5}
      CAM_GATE_MAX_IN_FLIGHT_CHUNKS: ${CAM_GATE_MAX_IN_FLIGHT_CHUNKS:-1}
      CAM_GATE_REQUEST_TTL_SECONDS: ${CAM_GATE_REQUEST_TTL_SECONDS:-86400}
      CAM_GATE_TLS_CA_FILE: ${CAM_GATE_TLS_CA_FILE:-}
      CAM_GATE_TLS_SERVER_NAME: ${CAM_GATE_TLS_SERVER_NAME:-}
    # The API is reachable only from cam-edge-web on the Compose network.
    # Do not publish the backend port on the production host.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cam-edge-web:
    image: ${CAM_EDGE_WEB_IMAGE:-cam-edge-web:1.0.0}
    container_name: cam-edge-web
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /data:size=16m,mode=0700,uid=10001,gid=10001
      - /config:size=4m,mode=0700,uid=10001,gid=10001
    volumes:
      - ${CAM_EDGE_TLS_DIR:-/var/lib/cloud-artifact-management/edge/tls}:/tls:ro
    environment:
      CAM_CADDY_MODULE: edge
      CAM_EDGE_WEB_HTTPS: ${CAM_EDGE_WEB_HTTPS:-false}
      CAM_EDGE_WEB_TLS_CERT_FILE: ${CAM_EDGE_WEB_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_EDGE_WEB_TLS_KEY_FILE: ${CAM_EDGE_WEB_TLS_KEY_FILE:-/tls/privkey.pem}
      CAM_EDGE_CONTROL_HTTPS: ${CAM_EDGE_CONTROL_HTTPS:-false}
      CAM_EDGE_CONTROL_TLS_CERT_FILE: ${CAM_EDGE_CONTROL_TLS_CERT_FILE:-/tls/fullchain.pem}
      CAM_EDGE_CONTROL_TLS_KEY_FILE: ${CAM_EDGE_CONTROL_TLS_KEY_FILE:-/tls/privkey.pem}
      # Edge has one externally mapped control/API channel (8101).  There is
      # no separate Edge transfer listener in the production topology.
    depends_on:
      - cam-edge
    ports:
      # Caddy listens on an unprivileged port in the container; the host
      # publishes the standard public web ports directly.
      - "${CAM_EDGE_WEB_HTTP_BIND:-0.0.0.0}:${CAM_EDGE_WEB_HTTP_PORT:-80}:8080"
      - "${CAM_EDGE_WEB_HTTPS_BIND:-0.0.0.0}:${CAM_EDGE_WEB_HTTPS_PORT:-443}:8443"
      - "${CAM_EDGE_CONTROL_BIND:-0.0.0.0}:${CAM_EDGE_CONTROL_PORT:-8101}:8101"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    ipam:
      config:
        - subnet: ${CAM_DOCKER_SUBNET:-192.168.241.0/24}

